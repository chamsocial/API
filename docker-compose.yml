services:
  mysql_cham_container:
    restart: unless-stopped
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - 23306:3306
    volumes:
      - ./data/mysql:/var/lib/mysql
  redis_cham_container:
    restart: unless-stopped
    image: redis:7
    ports:
     - 26379:6379
    volumes:
     - ./data/redis:/data

